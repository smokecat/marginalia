name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check lint

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          - os: macos-latest
            bash: /bin/bash # macOS 自带的 bash 3.2，确保不依赖 bash 4+ 特性
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # bats 自身需要 bash 4+ 才能处理中文测试名；被测的 marginalia 仍由 MARGINALIA_TEST_BASH 指定为 /bin/bash 3.2
      - if: runner.os == 'macOS'
        run: brew install bash
      - run: scripts/check test # bats 未安装时由 scripts/check 通过 npx 运行
        env:
          MARGINALIA_TEST_BASH: ${{ matrix.bash }}
